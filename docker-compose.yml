services:
  # MySQL/MariaDB Database
  db:
    image: mariadb:11.4
    container_name: ptas-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ptas_db
      MYSQL_USER: ptas_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ptas-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u ptas_user -p$${MYSQL_PASSWORD} --silent"]
      timeout: 20s
      retries: 10
      interval: 10s

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptas-api
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://ptas_user:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/ptas_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ptas-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  ptas-network:
    driver: bridge
