version: '3.8'

services:
  # MySQL/MariaDB Database
  db:
    image: mariadb:latest
    container_name: ptas-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ptas_db
      MYSQL_USER: ptas_user
      MYSQL_PASSWORD: ptas_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ptas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ptas_user", "-pptas_password"]
      timeout: 20s
      retries: 10
      interval: 10s

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptas-api
    environment:
      DATABASE_URL: mysql+pymysql://ptas_user:ptas_password@db:3306/ptas_db
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ptas-network
    command: uvicorn Backend.main:app --host 0.0.0.0 --port 8000 --reload
    # For production, use:
    # command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker Backend.main:app --bind 0.0.0.0:8000

volumes:
  db_data:

networks:
  ptas-network:
    driver: bridge
